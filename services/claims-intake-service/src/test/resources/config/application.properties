# Test-only overrides. Boot reads classpath:config/application.properties on top of the main
# application.properties, so only the keys below change. The values are fixed test fixtures,
# not secrets used anywhere else.
admin.token-secret=test-only-token-secret-0123456789-abcdefghijklmnop
admin.signup-code=test-signup-code
appeals.storage.mode=local
appeals.storage.local-dir=target/test-appeal-docs
