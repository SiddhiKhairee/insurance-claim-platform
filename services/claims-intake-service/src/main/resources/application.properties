spring.application.name=claims-intake-service
server.port=8082

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/claims_platform}
spring.data.mongodb.database=claims_platform
# Creates the unique indexes declared with @Indexed (appeals.claimId, admin_users.username) at
# startup. Off by default in Boot 3; the one-appeal-per-claim and unique-username guarantees rely on it.
spring.data.mongodb.auto-index-creation=true

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Appeal uploads: at most 3 files of 5 MB each (AppealService). The request cap leaves room for
# 3 files plus the reason text. Oversized uploads are rejected here, by the container, with 413
# (ApiExceptionHandler); AppealService's own size check is a second line of defence. nginx's
# client_max_body_size in infra/nginx/prod.conf matches the request cap.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
# Lets Tomcat read and discard the rest of an oversized body so the client receives the 413
# instead of a connection reset (Tomcat's default is 2 MB).
server.tomcat.max-swallow-size=20MB

# Where appeal documents are stored: "local" (a directory, for dev) or "s3" (the private bucket,
# via the EC2 instance role). See DocumentStorageConfig.
appeals.storage.mode=${APPEAL_STORAGE_MODE:local}
appeals.storage.local-dir=${APPEAL_STORAGE_DIR:/data/appeal-docs}
appeals.storage.s3-bucket=${S3_BUCKET:}
appeals.storage.s3-region=${AWS_REGION:us-east-1}

# Admin accounts. Both values come from .env and are never committed. An empty signup code
# disables admin sign-up; a missing or short token secret stops the service from starting.
admin.signup-code=${ADMIN_SIGNUP_CODE:}
admin.token-secret=${ADMIN_TOKEN_SECRET:}
admin.token-ttl=2h
# Trust nginx's X-Real-IP header for the login/sign-up rate limiter. Only the prod compose file
# turns this on, because only there does every request arrive through nginx.
admin.rate-limit.trust-proxy-header=${ADMIN_TRUST_PROXY_HEADER:false}
