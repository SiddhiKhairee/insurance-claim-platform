spring.application.name=notification-service
server.port=8084

# Consumer bootstrap-servers/group-id are read via @Value in KafkaConsumerConfig, which
# builds its own ConsumerFactory (ErrorHandlingDeserializer + JsonDeserializer, no type
# headers) rather than relying on Spring Boot's autoconfigured one, since the DLT
# recoverer wiring needs a custom container factory.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/claims_platform}
spring.data.mongodb.database=claims_platform
