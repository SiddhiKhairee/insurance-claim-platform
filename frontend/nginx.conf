# The frontend image's own nginx config, used as-is by the dev stack (infra/docker-compose.yml).
# Its only job beyond serving files: send any unknown path to index.html so client-side routes
# (/claims/<id>, /admin/...) survive a refresh. Production mounts infra/nginx/prod.conf over this
# file, which does the same and also proxies the APIs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
