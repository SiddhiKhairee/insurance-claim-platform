services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  enrollment-service:
    build: ../services/enrollment-service
    env_file:
      - ../.env
    ports:
      - "8081:8081"

  claims-intake-service:
    build: ../services/claims-intake-service
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      - redpanda
    ports:
      - "8082:8082"

  adjudication-service:
    build: ../services/adjudication-service
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8081
    depends_on:
      - redpanda
      - enrollment-service
    ports:
      - "8083:8083"

  notification-service:
    build: ../services/notification-service
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    ports:
      - "8084:8084"

  rag-assistant-service:
    build: ../services/rag-assistant-service
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_CLAIMS_API_URL: http://localhost:8082
    ports:
      - "3000:80"

volumes:
  redpanda-data:
