services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  enrollment-service:
    build: ../services/enrollment-service
    env_file:
      - ../.env
    ports:
      - "8081:8081"

  claims-intake-service:
    build: ../services/claims-intake-service
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      - redpanda
    ports:
      - "8082:8082"

  adjudication-service:
    build: ../services/adjudication-service
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8081
    depends_on:
      - redpanda
      - enrollment-service
    ports:
      - "8083:8083"

  notification-service:
    build: ../services/notification-service
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    ports:
      - "8084:8084"

  rag-assistant-service:
    build: ../services/rag-assistant-service
    env_file:
      - ../.env
    environment:
      CLAIMS_INTAKE_URL: http://claims-intake-service:8082
      # Origin the browser loads the frontend from (same pattern as claims-intake-service).
      # Local dev only; Phase 8 sets the real deployed origin.
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      - claims-intake-service
    ports:
      - "8000:8000"
    # /health is liveness only (200 while models load in the background); start_period covers
    # the first model load so a slow start isn't flagged unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_CLAIMS_API_URL: http://localhost:8082
        # Baked in at build time and called from the browser, so it must be the address the
        # browser can reach. Local dev only; Phase 8 sets the real deployed URL.
        VITE_RAG_API_URL: http://localhost:8000
    ports:
      - "3000:80"

volumes:
  redpanda-data:
