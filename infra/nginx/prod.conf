# Production-only nginx config. docker-compose.prod.yml mounts it over the frontend image's
# default.conf. Dev (docker-compose.yml) doesn't use it; there the browser calls each service's
# published port directly.
#
# Why: the EC2 security group opens only port 80 (PLAN.md §8.3). Everything the browser needs is
# on this one origin: the SPA at /, claims-intake-service at /claims and /api/admin/, and
# rag-assistant-service at /assistant/. These paths already match frontend/src/api.js, so nothing
# is rewritten.
# Appeal uploads are unauthenticated and go to S3, so they are rate-limited (PLAN.md §12, Phase 8b
# Part 2). nginx can't express less than 1 request/minute, so two zones cap it:
# - per client IP: 1/min, with a burst of 3 (a 5th rapid appeal from one address gets 429);
# - site-wide: 1/min, with a burst of 10, which bounds the total however many addresses are used.
# Storage is bounded by the bucket's lifecycle rule (appeals/ expires after 7 days), and by the
# instance being stopped by default. The worst-case arithmetic is in infra/aws/README.md.
limit_req_zone $binary_remote_addr zone=appeals_per_ip:1m rate=1r/m;
limit_req_zone $server_name zone=appeals_all:1m rate=1r/m;

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Putting the upstream in a variable makes nginx resolve it per
    # request instead of once at startup. So nginx still starts if a backend isn't up yet, and
    # it picks up a backend's new IP after that container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Appeal uploads. nginx uses the first regex location that matches, so this one has to come
    # before the general /claims location below.
    location ~ ^/claims/[^/]+/appeal$ {
        limit_req zone=appeals_per_ip burst=3 nodelay;
        limit_req zone=appeals_all burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @appeal_rate_limited;
        # Up to 3 documents of 5 MB each; matches Spring's multipart max-request-size.
        client_max_body_size 16m;
        set $claims_upstream http://claims-intake-service:8082;
        proxy_pass $claims_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same JSON error shape as claims-intake-service ({"error": "..."}).
    location @appeal_rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many appeals right now. Try again in a few minutes."}';
    }

    # Matches both /claims (the POST in api.js has no trailing slash) and /claims/<id>.
    location ~ ^/claims(/|$) {
        # Kept at 16m as well so an appeal path that somehow lands here isn't cut at nginx's
        # default 1 MB; the appeal location above is the one that normally matches.
        client_max_body_size 16m;
        set $claims_upstream http://claims-intake-service:8082;
        proxy_pass $claims_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (sign-up, login, appeal review). It lives under /api/admin so that /admin itself
    # stays a frontend route: refreshing /admin/... in the browser loads the SPA, not JSON.
    location /api/admin/ {
        set $claims_upstream http://claims-intake-service:8082;
        proxy_pass $claims_upstream;
        proxy_set_header Host $host;
        # The login/sign-up rate limiter keys on this. $remote_addr is the real TCP peer, and
        # this header overwrites anything the client sent (unlike X-Forwarded-For, which appends).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assistant/ {
        set $rag_upstream http://rag-assistant-service:8000;
        proxy_pass $rag_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The widget waits up to 60s (ASK_TIMEOUT_MS in api.js): two hosted-LLM providers plus
        # the groundedness model. nginx's own timeout has to be longer so the client times out first.
        proxy_read_timeout 90s;
    }
}
